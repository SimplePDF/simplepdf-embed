spec:
  name: simplepdf-copilot
  services:
    - name: web
      github:
        repo: SimplePDF/simplepdf-embed
        branch: main
        deploy_on_push: false
      source_dir: /copilot
      environment_slug: node-js
      build_command: npm run build
      run_command: npm start
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      envs:
        - key: VITE_SIMPLEPDF_COMPANY_IDENTIFIER
          scope: BUILD_TIME
          type: GENERAL
        - key: DEMO_CHAT_API_KEY
          scope: RUN_TIME
          type: SECRET
        - key: DEMO_CHAT_MODEL
          scope: RUN_TIME
          type: GENERAL
        - key: DEMO_RATE_LIMIT_TURNS
          scope: RUN_TIME
          type: GENERAL
        - key: DEMO_STT_OPENAI_API_KEY
          scope: RUN_TIME
          type: SECRET
        - key: REDIS_URL
          scope: RUN_TIME
          type: SECRET
        - key: IP_HASH_SALT
          scope: RUN_TIME
          type: SECRET
