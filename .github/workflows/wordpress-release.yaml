name: WordPress release

# Run by hand once the SVN tag is committed: WordPress.org releases happen outside GitHub.
on:
  workflow_dispatch:

jobs:
  announce:
    name: Record the plugin release on GitHub and announce it on Discord
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Announce the release
        run: node scripts/announce-wordpress-release.mjs
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
